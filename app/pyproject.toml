[project]
name = "ph18-72-lighting-ui"
version = "0.1.0"
description = "Testing UI for PH18-72 Linux lighting control"
requires-python = ">=3.11"
dependencies = [
  "pywebview>=5.0",
]

[project.scripts]
ph18-72-lighting-ui = "ph18_72_lighting_ui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
ph18_72_lighting_ui = ["ui/*"]
