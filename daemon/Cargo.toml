[package]
name = "ph18-lighting-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hardware daemon for Acer PH18-72 lighting control"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
